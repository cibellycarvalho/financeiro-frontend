server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos de /assets tem hash no nome (index-QDTQ6Dyc.js). Nome novo a
    # cada build, entao guardar pra sempre e seguro e economiza download.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html NAO pode ser guardado: e ele que diz qual bundle carregar.
    # Sem esta linha o navegador reusa o index antigo e continua pedindo o
    # bundle antigo — o deploy acontece e a pessoa nao ve nada mudar. Foi
    # exatamente o que aconteceu em 21/08/2026 com o redesenho do Lucro Real.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ { proxy_pass http://financeiro:5001; }
}
